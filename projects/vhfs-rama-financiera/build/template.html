<!doctype html>
<html lang="es"><head><meta charset="utf-8">
<style>
/*FONTS*/
:root{--ink:#101010;--slate:#394251;--slate7:#2A313C;--acc:#8492A8;--acc5:#ADB9CC;--acc3:#D6DCE6;--acc1:#F4F6F9;--acc9:#5D6879}
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1920px;height:1080px;overflow:hidden;background:#fff}
body{font-family:'Inter',sans-serif;-webkit-font-smoothing:antialiased}
.scene{position:absolute;inset:0;overflow:hidden}
.light{background:#fff;color:var(--slate)}
.dark{background:var(--slate);color:#fff}
.accent{background:var(--acc);color:#fff}
.inner{position:absolute;inset:0}
.corner{position:absolute;top:52px;right:72px;height:34px}
.corner svg{height:34px;width:auto;display:block}
/* logo colouring */
.logo path{fill:var(--lg-t,#101010)} .logo .st1{fill:var(--lg-s,#2D3947)} .logo .st3{fill:var(--lg-v,#394251)} .logo line{stroke:var(--lg-v,#394251);stroke-width:3}
.dark .logo,.accent .logo,.neg{--lg-t:#fff;--lg-s:#fff;--lg-v:#fff}
/* type */
.tt{font-family:'Inter Tight',sans-serif;letter-spacing:-0.02em}
.h-xl{font-family:'Inter Tight';font-weight:700;letter-spacing:-0.04em;line-height:.9}
.h1{font-family:'Inter Tight';font-weight:600;font-size:84px;line-height:1.02;letter-spacing:-0.025em}
.h2{font-family:'Inter Tight';font-weight:600;font-size:60px;line-height:1.08;letter-spacing:-0.02em}
.h3{font-family:'Inter Tight';font-weight:600;font-size:40px;line-height:1.15;letter-spacing:-0.01em}
.body{font-family:'Inter';font-weight:400;font-size:36px;line-height:1.35}
.lbl{font-family:'Inter';font-weight:500;font-size:34px;line-height:1.2}
.eyebrow{font-family:'Inter';font-weight:500;font-size:24px;letter-spacing:.24em;text-transform:uppercase;color:var(--acc9)}
.dark .eyebrow{color:var(--acc5)} .accent .eyebrow{color:var(--slate)}
.light b,.light strong{font-weight:700;color:var(--slate)}
.light .soft{color:var(--acc)} .dark .soft{color:var(--acc5)} .accent .soft{color:var(--slate)}
.light .ink{color:var(--ink)}
.dark b{font-weight:700;color:#fff} .accent b{font-weight:700;color:var(--slate7)}
.hl{color:var(--acc)} .dark .hl{color:var(--acc5)} .accent .hl{color:var(--slate7)}
/* icons */
svg.ic{width:100%;height:100%;overflow:visible;fill:none;stroke:currentColor;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
svg.ic .k{stroke:var(--acc)}
.dark svg.ic .k{stroke:var(--acc5)}
.disc{border-radius:50%;display:flex;align-items:center;justify-content:center;flex:none}
.disc>i{display:block;width:52%;height:52%}
.light .disc{background:var(--acc1);box-shadow:inset 0 0 0 3px var(--acc3);color:var(--slate)}
.dark .disc,.accent .disc{background:#fff;color:var(--slate)}
.dark .disc svg.ic .k,.accent .disc svg.ic .k{stroke:var(--acc)}
.disc.inv{background:var(--slate)!important;box-shadow:none!important;color:#fff!important}
.disc.inv svg.ic .k{stroke:var(--acc5)!important}
i.icon{display:block}
.row{display:flex;align-items:center}
.col{display:flex;flex-direction:column;align-items:center;text-align:center}
.abs{position:absolute}
.line{height:3px;background:currentColor;transform-origin:left center}
.card{background:var(--acc1);border-radius:6px}
.pill{border:2.5px solid currentColor;border-radius:12px;padding:10px 26px}
.wd{display:inline-block;white-space:pre}
/* subtitles */
#subs{position:absolute;left:0;right:0;bottom:46px;display:flex;justify-content:center;pointer-events:none;z-index:999}
#subs span{font-family:'Inter';font-weight:500;font-size:34px;line-height:1.3;max-width:1500px;text-align:center;padding:8px 22px;border-radius:6px}
</style></head>
